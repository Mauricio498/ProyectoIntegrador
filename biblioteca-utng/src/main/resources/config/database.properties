# ============================================================================
# Conexion a SQL Server
# Estos valores se ajustan a la instancia local antes de ejecutar la aplicación.
# ============================================================================

# Nombre o IP del servidor. Para una instancia nombrada usa:  localhost\\SQLEXPRESS
db.servidor=localhost
db.puerto=1433
db.base=BibliotecaUTNG

# Autenticación de SQL Server (usuario/contraseña)
db.usuario=sa
db.password=*Mau498*

# Si prefieres autenticación de Windows, pon true y deja usuario/password vacios.
# Requiere el mssql-jdbc_auth DLL en el PATH.
db.autenticacionWindows=false

# Certificado autofirmado en desarrollo
db.trustServerCertificate=true
db.encrypt=true

# Pool de conexiones
db.poolMaximo=10
db.poolMinimo=2
db.timeoutConexionMs=15000
